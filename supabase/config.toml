project_id = "bitepoint-lab"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5175",
  "https://armutie.github.io/bitepoint/",
]
enable_anonymous_sign_ins = true
enable_manual_linking = true

[functions.leaderboard]
enabled = true
# Board reads are public. Protected routes validate their Supabase JWT inside
# the function so one REST-shaped function can serve both kinds of request.
verify_jwt = false
import_map = "./functions/leaderboard/deno.json"
entrypoint = "./functions/leaderboard/index.ts"
