<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bite Point · Car review</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101318;color:#eee;font:13px system-ui}canvas{width:100%;height:100%;display:block}aside{position:absolute;top:12px;left:12px;background:#101318df;padding:14px;border:1px solid #ffffff30;border-radius:8px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px;width:235px}input{max-width:120px}label{min-width:0;display:flex;justify-content:space-between;gap:8px}select,button{background:#26313d;color:white;border:1px solid #637080;padding:4px}output{font-variant-numeric:tabular-nums;color:#c0cbd6;font-size:11px;overflow-wrap:anywhere}</style></head><body><canvas id="view"></canvas><aside><strong>CAR REVIEW</strong><label>Camera<select id="camera"><option value="halo">Onboard</option><option value="chase">Chase</option><option value="hood">Road</option><option value="topDown">Overhead</option></select></label><label>Track position<input id="position" type="range" min="0" max="2500" value="110" step="1"></label><label>Lateral offset<input id="lateral" type="range" min="-14" max="14" value="0" step="0.05"></label><label>Steering<input id="steer" type="range" min="-0.28" max="0.28" value="0" step="0.01"></label><label>Full grid<input id="field" type="checkbox"></label><label>Ghost<input id="ghost" type="checkbox"></label><label>Clean picture<input id="clean" type="checkbox"></label><label>Classic framing<input id="classic" type="checkbox"></label><label>Performance mode<input id="performance" type="checkbox"></label><label>Pit inspection<input id="pit" type="checkbox"></label><label>Contact close-up<input id="contact" type="checkbox"></label><label>Tour<input id="tour" type="checkbox"></label><output id="stats">Loading…</output></aside><script type="module" src="/src/dev/visualLab.ts"></script></body></html>
